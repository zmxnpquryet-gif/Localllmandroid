name: Feature request
description: Suggest an idea or improvement for the app
labels: [ enhancement ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the feature you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
