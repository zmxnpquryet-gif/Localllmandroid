name: Nightly real-model verification

# Real weights never run in normal CI (no multi-GB downloads on every push).
# This workflow is manual + nightly. A missing URL/file skips via Assume, but a
# CONFIGURED-yet-dead URL fails fast below, so "green" always means something ran.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      moe_url:
        description: "Gated-expert GGUF URL (overrides LOCALENGINE_MOE_URL secret)"
        required: false
        default: ""
      golden_model_url:
        description: "Qwen3-30B-A3B GGUF URL for the golden-logit test (defaults to the official Q4_K_M)"
        required: false
        default: "https://huggingface.co/Qwen/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-Q4_K_M.gguf"

jobs:
  real-model:
    name: Real MoE / GGUF checks
    runs-on: ubuntu-latest
    env:
      LOCALENGINE_MOE_URL: ${{ inputs.moe_url || secrets.LOCALENGINE_MOE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Configured-but-unreachable must be red, not a quiet Assume-skip.
      - name: Probe MoE URL reachability
        if: env.LOCALENGINE_MOE_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-0' --max-time 60 "$LOCALENGINE_MOE_URL")
          echo "MoE URL probe: HTTP $code"
          if [ "$code" != "206" ] && [ "$code" != "200" ]; then
            echo "::error::LOCALENGINE_MOE_URL is configured but unreachable (HTTP $code)"
            exit 1
          fi

      - name: Run live MoE range-streaming test
        run: ./gradlew :engine:testDebugUnitTest --tests "com.localllm.engine.RealMoETest" --stacktrace

      # RealModelTest needs a real llama-arch GGUF file on the runner. Maintainers
      # point LOCALENGINE_MODEL_URL at a SMALL one (it asserts llama tensors and a
      # 1000+ tokenizer vocab; a 19 GB flagship has no place here).
      - name: Provision small GGUF for RealModelTest
        id: provision
        if: secrets.LOCALENGINE_MODEL_URL != ''
        run: |
          mkdir -p /tmp/realmodel
          curl -fL --retry 2 --max-time 1800 -o /tmp/realmodel/model.gguf "${{ secrets.LOCALENGINE_MODEL_URL }}"
          ls -la /tmp/realmodel
          echo "model=/tmp/realmodel/model.gguf" >> "$GITHUB_OUTPUT"

      - name: Run real-file GGUF test
        if: steps.provision.outputs.model != ''
        env:
          LOCALENGINE_MODEL: ${{ steps.provision.outputs.model }}
          LOCALENGINE_FULL: '1'
        run: ./gradlew :engine:testDebugUnitTest --tests "com.localllm.engine.RealModelTest" --stacktrace

  # Golden-logit correctness gate: SDengine vs llama.cpp on the same Qwen3-30B-A3B
  # GGUF. The committed golden JSON (engine/src/test/resources/golden) pins
  # llama.cpp's prompt token ids, top-20 logprobs at the last prompt position and
  # the greedy continuation. Accuracy gates (tokenizer ids match, top-1 >= 99%,
  # greedy exact) are the Phase 1 completion criteria of the SDengine correctness
  # plan: this job is expected to be RED until those fixes land, then must stay
  # green. Runs nightly + manually; skips via Assume when no URL is configured.
  golden:
    name: Golden logits (SDengine vs llama.cpp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for the 17 GiB model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download golden model
        env:
          GOLDEN_URL: ${{ inputs.golden_model_url || 'https://huggingface.co/Qwen/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-Q4_K_M.gguf' }}
        run: |
          mkdir -p /tmp/golden
          curl -fL --retry 3 --retry-all-errors -C - --max-time 3600 \
            -o /tmp/golden/model.gguf "$GOLDEN_URL"
          ls -la /tmp/golden

      - name: Run golden-logit test
        env:
          LOCALENGINE_GOLDEN_MODEL: /tmp/golden/model.gguf
        run: ./gradlew :engine:testDebugUnitTest --tests "com.localllm.engine.GoldenLogitTest" --stacktrace
