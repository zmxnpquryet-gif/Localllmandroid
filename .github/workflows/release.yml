name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache vendored sherpa-onnx AAR
        uses: actions/cache@v6
        with:
          path: app/libs/sherpa-onnx.aar
          key: sherpa-onnx-aar-1.13.8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (throwaway signing key)
        run: |
          keytool -genkeypair -v -keystore /tmp/ci-release.jks \
            -storepass ci-release -alias upload -keypass ci-release \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=CI Throwaway,O=CI,C=US"
          KEYSTORE_PATH=/tmp/ci-release.jks STORE_PASSWORD=ci-release KEY_PASSWORD=ci-release \
            ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
