name: OffconAI Release APK

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  desktop-windows:
    name: Build Windows Desktop (Rust + Slint)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust desktop target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Test & Build Windows Desktop Release
        working-directory: desktop
        run: |
          cargo test
          cargo build --release

      - name: Package Windows Desktop Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win/OffconAI-desktop | Out-Null
          Copy-Item desktop/target/release/offcon-desktop.exe dist-win/OffconAI-desktop/
          Compress-Archive -Path dist-win/OffconAI-desktop/* -DestinationPath OffconAI-desktop-windows-x86_64.zip -Force
          Get-FileHash OffconAI-desktop-windows-x86_64.zip -Algorithm SHA256 | Format-List

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x86_64
          path: OffconAI-desktop-windows-x86_64.zip

  release:
    name: Build Android APK & Linux Desktop & Publish
    needs: desktop-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust desktop target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache vendored sherpa-onnx AAR
        uses: actions/cache@v6
        with:
          path: app/libs/sherpa-onnx.aar
          key: sherpa-onnx-aar-1.13.8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding official upload keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/official-release.jks
            KEYSTORE_PATH=/tmp/official-release.jks \
            STORE_PASSWORD="$STORE_PASSWORD" \
            KEY_PASSWORD="$KEY_PASSWORD" \
            KEY_ALIAS="${KEY_ALIAS:-upload}" \
            ./gradlew assembleRelease --stacktrace
          else
            echo "::warning::Official keystore secret not found. Using throwaway key for build test."
            keytool -genkeypair -v -keystore /tmp/ci-release.jks \
              -storepass ci-release -alias upload -keypass ci-release \
              -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=CI Throwaway,O=CI,C=US"
            KEYSTORE_PATH=/tmp/ci-release.jks STORE_PASSWORD=ci-release KEY_PASSWORD=ci-release \
              ./gradlew assembleRelease --stacktrace
          fi

      - name: Verify APK signature and checksum
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          echo "=== APK SHA-256 ==="
          sha256sum "$APK_FILE"
          echo "=== APK Signature ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK_FILE" || true

      - name: Build Linux desktop distribution
        run: |
          ./gradlew :desktop:installDist --stacktrace
          cd desktop/build/install
          zip -r "$GITHUB_WORKSPACE/OffconAI-desktop-linux-x86_64.zip" desktop
          cp "$GITHUB_WORKSPACE/OffconAI-desktop-linux-x86_64.zip" "$GITHUB_WORKSPACE/OffconAI-desktop.zip"
          sha256sum "$GITHUB_WORKSPACE/OffconAI-desktop-linux-x86_64.zip"

      - name: Download Windows Desktop Artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-windows-x86_64
          path: ${{ github.workspace }}

      - name: Publish or Attach Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "Target tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading release assets..."
            gh release upload "$TAG" \
              app/build/outputs/apk/release/*.apk \
              OffconAI-desktop-windows-x86_64.zip \
              OffconAI-desktop-linux-x86_64.zip \
              OffconAI-desktop.zip \
              --clobber
          else
            echo "Release $TAG does not exist. Creating new release with assets..."
            gh release create "$TAG" \
              app/build/outputs/apk/release/*.apk \
              OffconAI-desktop-windows-x86_64.zip \
              OffconAI-desktop-linux-x86_64.zip \
              OffconAI-desktop.zip \
              --title "$TAG" \
              --generate-notes
          fi
